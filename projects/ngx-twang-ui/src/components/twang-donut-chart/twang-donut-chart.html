@if (total() > 0) {
  <div class="flex flex-col items-center gap-3">
    <svg [attr.width]="size()" [attr.height]="size()" [attr.viewBox]="'0 0 ' + size() + ' ' + size()">
      <circle
        [attr.cx]="size() / 2"
        [attr.cy]="size() / 2"
        [attr.r]="radius()"
        fill="none"
        stroke="var(--app-gray-100, #f3f4f6)"
        [attr.stroke-width]="strokeWidth()"
      />
      <g [attr.transform]="'rotate(-90 ' + size() / 2 + ' ' + size() / 2 + ')'">
        @for (arc of arcs(); track arc.label) {
          <circle
            [attr.cx]="size() / 2"
            [attr.cy]="size() / 2"
            [attr.r]="radius()"
            fill="none"
            [attr.stroke]="arc.color"
            [attr.stroke-width]="strokeWidth()"
            [attr.stroke-dasharray]="arc.dashArray"
            [attr.stroke-dashoffset]="arc.dashOffset"
            stroke-linecap="butt"
          />
        }
      </g>
    </svg>

    @if (showLegend()) {
      <div class="flex flex-col items-center gap-1.5">
        @for (arc of arcs(); track arc.label) {
          <div class="flex w-40 items-center justify-between gap-2 text-xs">
            <span class="flex min-w-0 items-center gap-1.5">
              <span class="size-2 shrink-0 rounded-full" [style.background]="arc.color"></span>
              <span class="truncate text-text">{{ arc.label }}</span>
            </span>
            <span class="shrink-0 font-semibold text-text">{{ arc.percentLabel }}</span>
          </div>
        }
      </div>
    }
  </div>
} @else {
  <p class="text-sm text-text-muted">{{ emptyMessage() }}</p>
}
